# House style. Starting values: doc 11/13 defaults + the owner's reference (docs/assets/layout-reference.png):
# creator facecam top ~40%, captions centered on the seam (yellow headline, white spoken captions), gameplay bottom.
# Measured reference-channel profiles (clip style study) replace or blend with this; analytics A/B tests arms.
name: house
source: defaults + owner reference screenshot (not measured)
length:
  short: {target: 30, min: 15, max: 45}
  long: {target: 75, min: 61, max: 90}
pacing:
  cuts_per_10s: 2.0
  median_shot_s: 3.5
  zooms_per_10s: 2.5
  zoom_amount: 1.15
  dead_air_s: 0.4
hook:
  cold_open_share: 0.85
  hook_s: 2.0
  hook_text_s: 2.5
  transition: whoosh
layout:
  arms: {stacked: 0.55, full: 0.22, small_cam: 0.15, letterbox: 0.08}   # starting mix (letterbox = raw 16:9 test arm, low share; docs/research/gta6-clip-examples.md); analytics bandit reallocates per channel+platform
  stacked: {cam_ratio: 0.40}
  small_cam: {bubble_width: 0.34, corner: top_left}
captions:
  # Text arms (doc 11, docs/research/gta6-clip-examples.md); starting shares, analytics bandit reallocates
  text_mode_arms: {hook_only: 0.6, hook_key_lines: 0.25, full: 0.15}   # hook-only = one headline, no subtitles
  text_style_arms: {box: 0.57, outline: 0.43}     # white rounded box + black text (4/7) | white text + black outline (3/7)
  headline_case_arms: {sentence: 0.75, upper: 0.25}  # sentence case is the starting favorite
  headline: {box_size_pct: 0.037, outline_size_pct: 0.045, box_fill: "#FFFFFF", box_text: "#000000",
             outline_fill: "#FFFFFF", outline_color: "#000000", radius_pct: 0.32, pad_pct: 0.28, emoji: true}
  words_per_line: [2, 4]
  max_lines: 2
  position: seam          # stacked: centered on the cam/gameplay seam; full: middle band
  all_caps: true
  font: Montserrat
  weight: 800
  size_pct: 0.062
  fill: "#FFFFFF"
  headline_fill: "#FFE11A"
  accent: "#FFE11A"
  outline_px: 7
  shadow_px: 2
  emphasis_scale: 1.1
  animation: pop
  karaoke: false
  min_on_screen_s: 0.4
  bridge_gap_s: 0.3
audio:
  lufs: -14
  true_peak: -1
  sfx_per_10s: 1.0
  game_duck_db: -6
ending:
  loop_share: 0.3
  hold_after_payoff_s: 0.8
  hold_after_explosion_s: 1.0
extras:
  emoji_rate: 0.0
credit:
  template: "@{creator} on {platform}"

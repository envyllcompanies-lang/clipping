# GTA 5 reference set for the clip-channel tracker.
# Used as the baseline until GTA 6 channels have a few weeks of history.
# Handles are resolved to channel IDs on the tracker's first run (YouTube channels.list forHandle);
# any handle that doesn't resolve, or whose uploads don't match GTA terms, gets flagged.
# role: tracker = clip/compilation channel we learn formats from
#       radar   = source creator (footage to clip), goes to the creator radar instead

clip_channels:
  - name: Red Arcade
    handle: "@RedArcade"
    channel_id: UCHZZo1h1cI1vg4I9g2RqOUQ
    style: long-form fails & wins compilations, community submissions, multi-game
    role: tracker
  - name: Prestige Clips
    handle: "@PrestigeClips"
    style: GTA 5 funny-moment and fail compilations
    role: tracker
  - name: GameSprout
    handle: "@GameSprout"
    style: heavily edited, SFX-driven fail compilations
    role: tracker
  - name: Onespot Gaming
    handle: "@OnespotGaming"
    style: physics experiments, ragdoll compilations
    role: tracker
  - name: Top Gaming Plays
    handle: "@TopGamingPlaysYT"
    style: funny moments and epic plays compilations
    role: tracker
  - name: GTA 5 Ragdolls Test
    handle: "@gta5ragdollstest187"
    style: short-form physics tests, crashes, ragdolls
    role: tracker
  - name: Hazardous
    handle: "@Hazardous"
    style: stunt, trickshot and fail compilations
    role: tracker
  - name: Ward
    handle: "@WardGaming"
    style: long-form Top 500 fails/wins compilations
    role: tracker
  - name: Roleplay Clips
    handle: "@RP_Clipz"
    style: GTA RP Shorts and compilations
    role: tracker
  - name: Daily GTA RP Clips
    handle: "@dailygtarpclips"
    style: daily top Twitch GTA RP clips
    role: tracker
  - name: Infinity GTA Clips
    handle: "@infinitygtaclips"
    style: vertical Shorts of top GTA RP streamers
    role: tracker

source_creators:
  - {name: IcyDeluxe, handle: "@IcyDeluxe", role: radar}
  - {name: Ivanowski, handle: "@Ivanowski", role: radar}
  - {name: Nought, handle: "@NoughtPointFourLIVE", role: radar}
  - {name: VanossGaming, handle: "@VanossGaming", role: radar}
  - {name: TGG, handle: "@TGG_", role: radar}
  - {name: DarkViperAU, handle: "@DarkViperAU", role: radar}
  - {name: Putther, handle: "@putther", role: radar}
  - {name: Bay Area Buggs, handle: "@Buggs", role: radar}
  - {name: Soup, handle: "@soup", role: radar}

data_sources:
  - name: HasRoot
    url: https://nopixel.hasroot.com/
    use: per-server GTA RP stream history, streamer and character lists, clip/VOD lookups

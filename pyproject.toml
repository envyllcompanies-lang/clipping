[project]
name = "clipping"
version = "0.1.0"
description = "Automated short-form clipping and multi-platform posting"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "pyscenedetect",
    "opencv-python",
    "numpy",
    "httpx",
    "pydantic",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipping*"]

[tool.ruff]
line-length = 100
target-version = "py311"

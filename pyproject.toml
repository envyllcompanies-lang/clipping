[project]
name = "clipping"
version = "0.1.0"
description = "Fully automated GTA 6 clipping and multi-platform posting system"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "websockets>=12",
  "streamlink>=6",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
clip = "clipping.cli:main"

[tool.setuptools.packages.find]
include = ["clipping*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs ffmpeg renders"]
